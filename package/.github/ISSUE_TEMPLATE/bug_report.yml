name: 🐛 Bug Report
description: Create a report to help us improve StoryScroller
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report! Please fill out this form as completely as possible.
        
        💡 **Tip**: If you're reporting a security vulnerability, please use our [Security Policy](../SECURITY.md) instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you have completed the following
      options:
        - label: I have searched for existing issues that might be related to this bug
          required: true
        - label: I have tested this on the latest version of StoryScroller
          required: true
        - label: I have read the [troubleshooting guide](../README.md#troubleshooting)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened and what you expected to happen
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: input
    id: storyscroller-version
    attributes:
      label: StoryScroller Version
      description: What version of StoryScroller are you using?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: react-version
    attributes:
      label: React Version
      description: What version of React are you using?
      placeholder: "18.2.0"
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Affected Browsers
      description: Which browsers are affected? (Select all that apply)
      multiple: true
      options:
        - Chrome/Chromium
        - Firefox
        - Safari
        - Edge
        - Mobile Safari (iOS)
        - Chrome Mobile (Android)
        - Other (please specify in additional context)

  - type: dropdown
    id: platforms
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other (please specify in additional context)

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using? (if mobile/tablet)
      placeholder: "iPhone 14, iPad Pro, Samsung Galaxy S23, etc."

  - type: textarea
    id: code-sample
    attributes:
      label: Minimal Code Sample
      description: Please provide a minimal code sample that reproduces the issue
      render: typescript
      placeholder: |
        import { StoryScroller } from '@primeinc/story-scroller'
        
        function App() {
          return (
            <StoryScroller
              sections={[
                <div>Section 1</div>,
                <div>Section 2</div>
              ]}
            />
          )
        }

  - type: textarea
    id: console-errors
    attributes:
      label: Console Errors
      description: Any errors in the browser console (if applicable)
      render: text
      placeholder: Paste any console errors here

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: |
        - Network conditions
        - Build tool configuration
        - Other libraries that might conflict
        - Screenshots or videos (if helpful)

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to help fix this bug?
      options:
        - label: I would be willing to submit a PR to fix this bug