name: 🔄 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # Code Quality and Type Checking
  quality:
    name: 📏 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🎯 Type Check
        run: pnpm typecheck

      - name: 📦 Build
        run: pnpm build

      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  # Unit Tests
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run Unit Tests
        run: pnpm test:unit:run --coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # Cross-browser Integration Tests
  integration-tests:
    name: 🌐 Integration Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: 🌐 Run Integration Tests
        run: pnpm test --project=${{ matrix.browser }}

      - name: 📁 Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Security Audit
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run security audit
        run: pnpm audit --audit-level moderate

      - name: 🔒 Check for known vulnerabilities
        run: |
          # Check package vulnerabilities
          if pnpm audit --json > audit.json 2>/dev/null; then
            VULNERABILITIES=$(cat audit.json | jq '.metadata.vulnerabilities.total // 0')
            if [ "$VULNERABILITIES" -gt 0 ]; then
              echo "::warning::Found $VULNERABILITIES vulnerabilities"
              cat audit.json | jq '.advisories'
            else
              echo "✅ No security vulnerabilities found"
            fi
          else
            echo "::warning::Could not run security audit"
          fi

  # Bundle Size Analysis
  bundle-analysis:
    name: 📦 Bundle Analysis
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: 📊 Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          
          for file in dist/*.js; do
            if [ -f "$file" ]; then
              SIZE=$(du -h "$file" | cut -f1)
              GZIPPED=$(gzip -c "$file" | wc -c | numfmt --to=iec-i --suffix=B)
              FILENAME=$(basename "$file")
              echo "| $FILENAME | $SIZE | $GZIPPED |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Check if bundle size is within limits (50KB threshold)
          MAIN_SIZE=$(stat -c%s dist/index.js)
          MAIN_SIZE_KB=$((MAIN_SIZE / 1024))
          
          if [ $MAIN_SIZE_KB -gt 50 ]; then
            echo "::warning::Main bundle size ($MAIN_SIZE_KB KB) exceeds 50KB threshold"
          else
            echo "✅ Bundle size within limits: $MAIN_SIZE_KB KB"
          fi

  # Release (only on release events)
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, security]
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Build for release
        run: pnpm build

      - name: 🔍 Verify package contents
        run: |
          echo "Package contents:"
          ls -la dist/
          echo "Package.json version: $(node -p "require('./package.json').version")"

      - name: 🚀 Publish to NPM
        run: pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📝 Create release summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $(node -p "require('./package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "- **Published to**: NPM Registry" >> $GITHUB_STEP_SUMMARY
          echo "- **Install**: \`npm install @primeinc/story-scroller\`" >> $GITHUB_STEP_SUMMARY

  # Demo Deployment (on main branch)
  deploy-demo:
    name: 🌐 Deploy Demo
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Build package
        run: pnpm build

      - name: 🌐 Build demo
        run: |
          cd ../demo
          pnpm install --frozen-lockfile
          pnpm build

      - name: 🚀 Deploy to Vercel (or your preferred platform)
        run: |
          echo "Demo deployment would happen here"
          echo "Configure with your preferred deployment platform"
          # Example: vercel deploy --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # Status Summary
  status:
    name: 📊 Status Summary
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, security, bundle-analysis]
    if: always()
    steps:
      - name: 📊 Generate status summary
        run: |
          echo "## 🔄 CI/CD Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Quality check
          if [ "${{ needs.quality.result }}" == "success" ]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Unit tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Integration tests
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ **Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security
          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "✅ **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Bundle analysis
          if [ "${{ needs.bundle-analysis.result }}" == "success" ]; then
            echo "✅ **Bundle Analysis**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Bundle Analysis**: Failed" >> $GITHUB_STEP_SUMMARY
          fi