name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '20.17.0'
  PNPM_VERSION: '9.12.0'

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment for GitHub Pages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect changes to optimize workflow execution
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.changes.outputs.package }}
      demo: ${{ steps.changes.outputs.demo }}
      root: ${{ steps.changes.outputs.root }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            package:
              - 'package/**'
            demo:
              - 'demo/**'
            root:
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'

  # Code Quality and Type Checking
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true' || needs.changes.outputs.demo == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            package/dist/
            demo/dist/
          retention-days: 1

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run Unit Tests
        run: pnpm --filter @primeinc/storyscroller run test:unit:run -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./package/coverage/lcov.info
          fail_ci_if_error: false

  # Cross-browser Integration Tests
  integration-tests:
    name: Integration Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true' || needs.changes.outputs.demo == 'true' || needs.changes.outputs.root == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Playwright Browsers
        run: pnpm --filter @primeinc/storyscroller-demo exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build for testing
        run: pnpm run build

      - name: Run Integration Tests
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Run comprehensive tests on main branch
            pnpm --filter @primeinc/storyscroller-demo exec playwright test --project=${{ matrix.browser }} --project=${{ matrix.browser }}-comprehensive
          else
            # Run only essential tests on feature branches
            pnpm --filter @primeinc/storyscroller-demo exec playwright test --project=${{ matrix.browser }}
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            package/test-results/
            demo/test-results/
          retention-days: 7

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.package == 'true' || needs.changes.outputs.demo == 'true' || needs.changes.outputs.root == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          if pnpm audit --json > audit.json 2>/dev/null; then
            VULNERABILITIES=$(cat audit.json | jq '.metadata.vulnerabilities.total // 0')
            if [ "$VULNERABILITIES" -gt 0 ]; then
              echo "::warning::Found $VULNERABILITIES vulnerabilities"
              cat audit.json | jq '.advisories'
            else
              echo "✅ No security vulnerabilities found"
            fi
          else
            echo "::warning::Could not run security audit"
          fi

  # Bundle Size Analysis
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.package == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          
          for file in package/dist/*.js; do
            if [ -f "$file" ]; then
              SIZE=$(du -h "$file" | cut -f1)
              GZIPPED=$(gzip -c "$file" | wc -c | numfmt --to=iec-i --suffix=B)
              FILENAME=$(basename "$file")
              echo "| $FILENAME | $SIZE | $GZIPPED |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Check if bundle size is within limits (50KB threshold)
          if [ -f "package/dist/index.js" ]; then
            MAIN_SIZE=$(stat -c%s package/dist/index.js)
            MAIN_SIZE_KB=$((MAIN_SIZE / 1024))
            
            if [ $MAIN_SIZE_KB -gt 50 ]; then
              echo "::warning::Main bundle size ($MAIN_SIZE_KB KB) exceeds 50KB threshold"
            else
              echo "✅ Bundle size within limits: $MAIN_SIZE_KB KB"
            fi
          fi


  # Release to NPM (only on release events)
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, security]
    if: github.event_name == 'release' && !cancelled()
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build for release
        run: pnpm run build:package

      - name: Verify package contents
        run: |
          echo "Package contents:"
          ls -la package/dist/
          echo "Package.json version: $(node -p "require('./package/package.json').version")"

      - name: Publish to NPM
        run: cd package && pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $(node -p "require('./package/package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "- **Published to**: NPM Registry" >> $GITHUB_STEP_SUMMARY
          echo "- **Install**: \`npm install @primeinc/storyscroller\`" >> $GITHUB_STEP_SUMMARY

  # Build Demo for GitHub Pages
  build-demo:
    name: Build Demo
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm run build

      - name: Build demo for GitHub Pages
        env:
          PUBLIC_URL: /StoryScroller
        run: |
          cd demo
          pnpm run build -- --base=/StoryScroller/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo/dist

  # Deploy to GitHub Pages
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-demo
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # Generate and update sitemap
  sitemap:
    name: Update Sitemap
    runs-on: ubuntu-latest
    needs: [deploy-pages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate sitemap
        run: |
          cd demo
          pnpm run sitemap

      - name: Upload sitemap to deployment
        run: |
          echo "Sitemap generated and will be included in next deployment"
          ls -la demo/public/sitemap.xml

  # Status Summary
  status:
    name: Status Summary
    runs-on: ubuntu-latest
    needs: [changes, quality, unit-tests, integration-tests, security, bundle-analysis]
    if: always()
    steps:
      - name: Generate status summary
        run: |
          echo "## 🔄 CI/CD Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Quality check
          if [ "${{ needs.quality.result }}" == "success" ]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.quality.result }}" == "skipped" ]; then
            echo "⏭️ **Code Quality**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Unit tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.unit-tests.result }}" == "skipped" ]; then
            echo "⏭️ **Unit Tests**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Integration tests
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ **Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-tests.result }}" == "skipped" ]; then
            echo "⏭️ **Integration Tests**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security
          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "✅ **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security.result }}" == "skipped" ]; then
            echo "⏭️ **Security**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Bundle analysis
          if [ "${{ needs.bundle-analysis.result }}" == "success" ]; then
            echo "✅ **Bundle Analysis**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.bundle-analysis.result }}" == "skipped" ]; then
            echo "⏭️ **Bundle Analysis**: Skipped (no package changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Bundle Analysis**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Additional context
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Components" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: ${{ needs.changes.outputs.package }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Demo**: ${{ needs.changes.outputs.demo }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Root**: ${{ needs.changes.outputs.root }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docs**: ${{ needs.changes.outputs.docs }}" >> $GITHUB_STEP_SUMMARY